name: Build & Push to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Rebuild weekly to pick up upstream Aurelia updates
    - cron: "0 6 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/paulovaca/aurelia-docker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
